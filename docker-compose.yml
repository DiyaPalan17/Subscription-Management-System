services:
  postgres:
    image: postgres:16-alpine
    container_name: brightloop-postgres
    restart: always
    environment:
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop_password
      POSTGRES_DB: brightloop_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop -d brightloop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: brightloop-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
